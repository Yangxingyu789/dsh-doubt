# dsh-doubt plugin patch.
#
# The host's applyEntryPatches treats an entry without `insert:` as an override of
# an existing row; if the target is missing it only logs a warning and skips:
#   dsh: [dsh-doubt] patch: entry "dsh-doubt" not found
# Earlier this file lacked the `insert:` wrapper, so `dsh --profile test --dump-config`
# never inserted the row and the plugin was never loaded.
#
# To override config, add an entry with the same id in the profile cordis.patch.yml
# (later entries win). Note that overrides REPLACE the whole config, not deep-merge:
#   - id: dsh-doubt
#     config: { ... }
- insert:
    - id: dsh-doubt
      name: "dsh-doubt"
      config:
        enabled: true
        verifyTool: true
        promptSection: true

        # Tier A/B: the plugin collects evidence itself and injects measured results.
        autoVerify: true
        requireSources: 2
        onlineTimeoutMs: 8000

        # Tier C: offline, no local judge: re-derive independently and take the majority.
        factored: true
        factoredVotes: 3
        factoredProvider: spawn

        # Safety: never execute commands quoted in the answer; only check program availability.
        executeAnswerCommands: false
        strictLabeling: true
        # Require a step-by-step provenance table when a deliverable document is written
        # without inline source annotations.
        requireProvenance: true
        # Independent review before the final text is shown.
        requireOperationEvidence: true
        # Evidence-gathering budget for long answers. 2 is often exhausted by a single
        # multi-claim answer; 3 leaves one repair round.
        operationMaxRounds: 3
        # Review timeout and packet size. Review reasoning is disabled (see below).
        reviewTimeoutMs: 120000
        reviewMaxChars: 120000
        # Split long drafts into segments when one packet cannot hold all evidence.
        segmentedReview: true
        # Reasoning effort for the reviewer. Default off: thinking tokens can consume
        # the whole max_tokens budget and force an unreviewed release.
        reviewReasoningEffort: off
        # Live-mutation guard: live installs/process kills/registry changes/recursive
        # deletes must disclose a backup, a rollback command and a user confirmation.
        guardLiveMutation: true
        # Pre-execution gate: dangerous live mutations require host approval before the
        # tool runs; without an approval channel or with policy `never` they are denied.
        guardPreExecute: true
        # Trailing notice when review did not complete: banner / short / off.
        reviewNotice: off
        # Only review drafts that contain material claims (versions/paths/commands/
        # numbers/symbols/state assertions); pure chat drafts pass deterministically.
        reviewMaterialOnly: true

        maxRounds: 2
        minScore: 6
        maxFindings: 8
        minAnswerChars: 240
        language: auto
