# dsh-doubt 自带的 patch 层。
#
# 新行必须包在顶层 `insert:` 里：宿主的 applyEntryPatches 把「没有 insert 的条目」当作
# **按 id 覆盖已存在的行**，找不到目标就只打一句警告并跳过：
#   dsh: [dsh-doubt] patch: entry "dsh-doubt" not found
# 之前这里少了 insert 包裹，实测 `dsh --profile test --dump-config` 完全不会插入该行，
# 插件根本不会加载（verify_claims、提示词段、自动取证循环全都不会出现）。
#
# 用户想改配置，就在 profile 的 cordis.patch.yml 里加同 id 条目覆盖（后加载优先）：
#   - id: dsh-doubt
#     config: { ... }        # 注意：覆盖是整体替换 config，不是深合并
- insert:
    - id: dsh-doubt
      name: "dsh-doubt"
      config:
        enabled: true
        verifyTool: true
        promptSection: true

        # Tier A/B：插件自己取证，注入实测结果（不是要求模型「再检查一遍」）
        autoVerify: true
        requireSources: 2
        onlineTimeoutMs: 8000

        # Tier C：离线且无判据时，无草稿上下文独立重推导 + 多数投票
        factored: true
        factoredVotes: 3
        factoredProvider: spawn

        # 安全：默认不执行回答里出现的命令，只验证程序是否存在
        executeAnswerCommands: false
        strictLabeling: true
        # 交付文档（.md/.txt）写出但正文没有出处标注时，要求补一份逐步骤溯源表
        requireProvenance: true
        # 最终文本显示前独立审核；不受措辞、短回答与风险分门槛影响
        requireOperationEvidence: true
        # 长回答的回执补查预算：2 太容易在一次多断言回答里被耗尽（实测 turn 9 连续两次
        # verify 后只剩「补查预算用尽」横幅）。3 给多断言回答留一轮修复空间。
        operationMaxRounds: 3
        # 审核输入是中文正文+工具证据，字符量级≈token 量级。
        # 120k：让更多历史证据进包，减少「证据不在包里」式打回；审核已关闭 thinking。
        reviewTimeoutMs: 120000
        reviewMaxChars: 120000
        # 长草稿分段审核：单包装不下证据时按段拆成多次审核，避免整轮 fail-open
        segmentedReview: true
        # 审核调用的 reasoning effort：宿主 DeepSeek adapter 未指定时默认 high + thinking，
        # thinking token 与 max_tokens 共用。实测第 1 次尝试 12000 输出 token 全花在 thinking
        # 上（可见正文 0 字符）→ max-tokens → 只能带「未经完整审核」横幅放行。默认 off。
        reviewReasoningEffort: off
        # 危险变更闸门：出现 live profile/插件安装、杀进程/停服务、注册表/服务、递归删除等
        # 动作时，最终审核确定性打回，要求回滚路径 + 用户确认 + 动作后独立健康检查
        guardLiveMutation: true
        # 执行前闸门：危险 live 变更在工具体执行前要求宿主权限审批（ask）；
        # 无审批通道或策略为 never 时拒绝执行（deny），而不是事后才披露
        guardPreExecute: true
        # 最终审核未完成时的末尾提示：banner=完整横幅+意见；short=一行；off=不显示
        reviewNotice: short

        maxRounds: 2
        minScore: 6
        maxFindings: 8
        minAnswerChars: 240
        language: auto
