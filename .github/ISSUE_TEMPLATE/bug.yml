name: Bug report
description: Report a reproducible defect in dsh-doubt
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, credentials, private session logs or personal paths.
        For security issues use the private vulnerability reporting link in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: dsh-doubt version
      description: Output of the plugin banner or package.json version
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: DSH host version and platform
      description: For example DSH desktop 0.2.1-rc.2 on Windows 11, Node 24
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal commands, prompt and tool sequence
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description: Redact secrets and private paths
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed credentials, real session content and personal paths
          required: true
        - label: I searched existing issues
          required: true
