name: Feature request
description: Suggest a capability or release improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What failure mode or user need should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe behavior, config and compatibility impact
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This is not a security vulnerability (see SECURITY.md)
          required: true
        - label: I searched existing issues and releases
          required: true
