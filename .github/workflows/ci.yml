name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    # Portable checks: no installed DSH app required.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run check
      - run: npm run build
      - run: npm run smoke
      - run: npm run audit

  tests:
    # Host integration is Windows-first (local oracles, argv escaping, PATHEXT,
    # junctions). These suites SKIP with exit 0 when no DSH install is present.
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run build
      - run: npm test
      - run: npm run verify:host
      - run: npm run verify:host-loop
      - run: npm run verify:independent
