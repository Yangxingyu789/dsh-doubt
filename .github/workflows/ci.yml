name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # Windows is the primary target (local oracles, argv escaping, PATHEXT, junctions).
    # Ubuntu is included to keep the code portable.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck, build, unit tests, smoke, repository self-audit, host tests and
      # host-loop regression. Host tests that need an installed desktop app SKIP
      # honestly (exit 0) in CI; real regressions FAIL the build.
      - run: npm run verify
