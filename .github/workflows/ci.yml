name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # 插件的主目标平台是 Windows（本机 oracle、argv 转义、PATHEXT、junction 都在那边），
    # 所以两个平台都跑：ubuntu 保证可移植性没有被破坏，windows 才是真实使用环境。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck + build + 7 套测试 + smoke + 仓库自检 + 宿主测试 + 外部裁判。
      # CI 里没有已安装的桌面应用，所以宿主测试与"解包宿主"那几项会如实 SKIP 并以 0 退出；
      # 真正的回归会 FAIL 并让构建变红（旧版这里用 continue-on-error 把 FAIL 吞掉了）。
      - run: npm run verify
